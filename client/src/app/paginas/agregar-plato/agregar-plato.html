<app-navbar
    [titulo]="'Ver reservas'"
    [ruta]="'/reservas'"
    [titulo2]="'Ver mesas'"
    [ruta2]="'/mesas'">
</app-navbar>
<div>
    <div>
        <h2>Agregar Plato</h2>
        <form [formGroup]="platoForm" (ngSubmit)="publicar()">
            <div>
                <input type="text" placeholder="Nombre" formControlName="nombre">
            </div>
            <div>
                <input type="number" placeholder="Precio" formControlName="precio">
            </div>
            <div>
                <input type="file" accept="image/*" (change)="handleFileChange($event)">
            </div>
            <button type="submit">
                Agregar
            </button>
        </form>
    </div>
    <div class="tabla-platos">
        <table>
            <thead>
                <tr>
                    <th>Plato</th>
                    <th>Precio</th>
                    <th>Imagen</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                @for (plato of platos; track plato.id) {
                    <tr>
                        <td>{{ plato.nombre }}</td>
                        <td>S/. {{ plato.precio }}</td>
                        <td><img [src]="plato.rutaImagen"></td>
                        <td><button (click)="eliminar(plato.nombre)">🗑</button></td>
                    </tr>  
                }
            </tbody>
        </table>
    </div>
</div>
